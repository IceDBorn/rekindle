; Crash restore settings. 1 turns a feature on, 0 turns it off. Missing keys keep these defaults.

[restore]
; Restore a crashed run on the next launch (plants the save and plays the fake host).
auto_restore=1
; Keep a restored run online after the fake host leaves.
keep_online=1
; Put items left on the ground back after a restore.
restore_ground_items=1
; Give back runes earned after the game last wrote the save.
restore_runes=1
; Use the snapshot position when the save has none (crash in the first seconds of a run).
restore_position=1
; Give the restored player its own number from the run again, so bosses drop dormant powers.
fix_boss_drops=1
; Re-light field boss graces that reload events switch off.
fix_graces=1
; Put back HP of damaged enemies and bosses that were alive in the snapshot.
restore_enemy_hp=1

[penalties]
; Remove the 300 s idle kick.
remove_afk_kick=1
; Rejoining after a crash costs no level and drops no runes.
remove_rejoin_penalty=1
; A player who crashed while downed comes back standing.
respawn_if_downed=1

[snapshots]
; Seconds into a run before the first snapshot.
first_after_s=10
; Seconds between snapshots.
every_s=30
; Seconds after a restore before snapshots start again.
resume_after_restore_s=60
; Real seconds before a boss phase when snapshots stop, so a restore leaves time to rejoin. The boss restarts.
stop_before_boss_s=60

[ping]
; Show the round trip time next to teammate names. Only teammates who also run Rekindle answer the ping.
show_ping=1
; Show packet loss from the teammate next to their name when it reaches 1%.
show_loss=1
; Show ping and loss in the HUD party list.
hud_labels=1
; Show ping and loss in the name labels above teammates.
overhead_labels=0

[hub]
; Experimental. Players in one game party see each other in the Roundtable Hold. Every party member needs Rekindle.
; Players see each other until the expedition starts.
shared_roundtable=0
; Experimental. Needs shared_roundtable=1. Players in the Sparring Grounds can hit each other, and a player
; brought to 1 HP dies.
sparring_pvp=0

[log]
; off, error, warn, info or debug. The log is rekindle.log next to the DLL.
level=error
